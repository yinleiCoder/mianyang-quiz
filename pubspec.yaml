name: mianyang_quiz
description: "绵阳市中职共建题库 · 刷题客户端"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI：Material 已从 SDK 拆出为独立包（见 AGENTS.md 第一条）。
  # go_router 18 依赖的也是这个包，两者必须一致，否则路由转场静默失效。
  material_ui: ^1.2.0
  cupertino_icons: ^1.0.8

  # 路由与状态（不使用 MVVM）
  go_router: ^18.0.1
  provider: ^6.1.5

  # 后端：Auth / PostgREST / RPC 走官方 SDK；
  # dio 只用于网页端的 /api/oss/sign 签名与 OSS 直传（见 lib/core/network/oss_dio.dart）。
  supabase_flutter: ^2.17.2
  dio: ^5.11.1
  # 显式声明 http：core/network/auth_refresh_client.dart 要包一层 http.Client
  # 来接住 401（令牌过期自愈）。它本来就是 supabase_flutter 的传递依赖，
  # 但**用到了就要写进 pubspec**，否则哪天上游换实现这里会静默断掉。
  http: ^1.6.0

  # 屏幕适配（桌面端需关闭缩放，见 bootstrap.dart）
  flutter_screenutil: ^5.9.3

  # 图表（学情看板）：注意是 1.x，API 与网上大量 0.6x 示例不同
  fl_chart: ^1.2.0

  # 模型层代码生成
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  cached_network_image: ^4.0.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  # 题目里的音视频与附件用系统默认程序打开（本项目不做内嵌播放器：
  # 目标平台里的 Windows 没有官方 video_player/just_audio 支持）
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_svg: ^2.3.0
  # AI 答疑的内嵌浏览器。**不用官方 webview_flutter**：它只实现 Android/iOS，
  # Windows 上没有任何官方实现（原先只能给"用浏览器打开"的降级入口）。
  # 这个包 Windows 端走 WebView2，**构建机必须把 nuget.exe 放进 PATH**
  #（本机：choco install NuGet.CommandLine；CI：工作流里显式装一步），
  # 否则 `flutter build windows` 直接失败；用户机器需要 WebView2 运行时
  #（Win11 自带，Win10 一般随 Edge 装上，安装器可另带 bootstrapper）。
  # **必须是 6.2 的 beta，不能回 6.1.5**：稳定版 flutter_inappwebview_android 1.1.3 的
  # build.gradle 还在用 getDefaultProguardFile('proguard-android.txt')，而 AGP 9.0 起
  # 那个写法直接报错（见 android/gradle.properties 里那段注释——从 gradle 属性绕的那条路
  # 试过，无效）。1.2.0-beta.3 是作者自己的前向修复：改用 proguard-android-optimize.txt，
  # 且 compileSdk 跟随 Flutter 而不再钉死 34。
  # 升级代价：umbrella 包会把 Windows 端一起带到 0.7.0-beta.3（原 0.6.0），两端都要验。
  flutter_inappwebview: ^6.2.0-beta.3
  audioplayers: ^6.8.1
  pdf: ^3.13.0
  printing: ^5.15.0
  contribution_heatmap: ^0.6.0

  # 复习资料区的 PDF 阅读。**为什么不用已经装了的 flutter_inappwebview 看 PDF**：
  # Android 的系统 WebView 根本没有内置 PDF 阅读器（Chrome 有，WebView 没有），
  # 拿 WebView 打开 OSS 上的 PDF 在手机上只会白屏。pdfrx 走 PDFium，六个平台一致。
  # 代价：**Windows 构建机必须开「开发者模式」**（它用符号链接装 PDFium 的 native assets），
  # 没开的话 flutter build windows 会直接报错并给出开启指引。
  pdfrx: ^2.6.5
  # 保存资料到本地。本来就是 share_plus 的传递依赖，但**用到了就要写进 pubspec**
  #（同 http 那条注释的理由：上游换实现时这里会静默断掉）。
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # 品牌标识：与网页端 public/mianyang.svg 同一张图（两端一致），
    # 用矢量是因为它在 36~56px 之间变化，不必按尺寸各出一档位图。
    - assets/mianyang.svg
    # 答题音效（程序合成，见 data/services/sfx_service.dart 文件头）
    - assets/sounds/

# 应用图标：源图 assets/app_icon.png（由 assets/mianyang.svg 渲染而来，见 AGENTS.md 第七节）。
# 改图标 = 换源图 + `dart run flutter_launcher_icons`，Windows 的 .ico 与 Android 的各档
# mipmap 都会被重新生成，不要手改那些产物。
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true

  # 安卓 8+ 的**自适应图标**。不配这一组的话，系统拿 legacy 方形图标去套启动器的
  # 圆形/方形遮罩 —— 源图的 logo 几乎铺满整张，四角会被裁掉，看起来就是"图标太大、显示不全"。
  #
  # 规范：108dp 画布里只有**中间 72dp（66.7%）是安全区**，外围随时可能被遮罩吃掉。
  # 源图（1024×1024，绵阳 logo，自带约 5% 白边）用 `inset: 18` 内缩后，
  # logo 实际落在画布的 64% 左右 —— 正好填满安全区且留一点余量，各家的圆/方遮罩都不会切到。
  # 背景取白色：源图本来就是白底，换成别的颜色会在 logo 边缘露出一圈异色。
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  adaptive_icon_foreground_inset: 18

  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
