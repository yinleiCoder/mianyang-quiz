org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# AGP 9 兼容：允许 proguard-android.txt
#
# flutter_inappwebview_android 1.1.3（稳定版）自己的 build.gradle 第 44/48 行用了
# getDefaultProguardFile('proguard-android.txt')，而 AGP 9.0 起这个写法**直接报错**：
#   `getDefaultProguardFile('proguard-android.txt')` is no longer supported ...
# 它发生在**求值插件自己的 build.gradle** 时，改不动（插件在 pub cache 里），
# 所以只能从 gradle 属性把这道闸门关掉。
#
# **两个属性都写上，是因为谷歌的发布说明自己串了行**：讲 proguardAndroidTxt 那一条，
# 给的退回属性名却是下一行的 globalOptionsInConsumerRules（讲库发布用的）。
# Gradle 对拼错的属性名是**静默忽略**，赌错的代价是一轮 CI，所以两个都设。
# 真正起作用的是第一个——它的默认值在 AGP 9.0 由 false 翻成了 true。
#
# 影响面：只影响 R8 的优化档位选择，不改变 APK 的行为。本项目自己的 app 模块
# 没有用 proguard-android.txt，所以这是纯粹为插件开的临时口子。
#
# **这是有期限的**：谷歌明说将来会移除这个开关。plugin 的 1.2.0-beta.3 已经改成
# proguard-android-optimize.txt 了（且 compileSdk 改为跟随 Flutter），
# 等它转正就该把这两行删掉、升插件。
# ---------------------------------------------------------------------------
android.r8.proguardAndroidTxt.disallowed=false
android.r8.globalOptionsInConsumerRules.disallowed=false
