# 发布客户端：打 tag（v*）即出 Android APK 与 Windows 压缩包，挂到本仓库的 GitHub Release。
#
# **本文件必须留在客户端仓库**（yinleiCoder/mianyang-quiz，也就是这个仓库）：
# 网页端仓库把本目录记成一个 gitlink（没有 .gitmodules），那边 checkout 出来是空目录，
# 工作流放那边根本构建不了。
#
# 为什么是 tag 触发：发布版本必须与代码一一对应，tag 是唯一不会漂移的锚点；
# 手动跑（workflow_dispatch）只为验证流水线本身，产出的包不会创建 Release。
#
# 混淆与符号：两个平台都带 --obfuscate --split-debug-info（见 AGENTS.md 第七节）。
# 符号文件（app.*.symbols + obfuscation-map.json）**只作为 Actions artifact 上传，不进 Release**——
# 它们能反解混淆，公开挂出去等于白混淆；排查崩溃时从 workflow 运行页下载即可。

name: Release clients

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # 只跑构建、不发 Release

permissions:
  contents: write # 创建 Release 需要

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  # ---------- Windows ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 版本号（tag → 版本名 + 递增版本号）
        # **必须显式传 --build-number**：否则 Android 的 versionCode 永远是 pubspec 里的 +1，
        # 而系统只允许 versionCode 更大的包覆盖安装 —— 用户会看到装到一半「应用未安装」。
        # 用 run_number 保证单调递增；版本名取 tag（去掉 v 前缀，versionName 不接受它）。
        id: ver
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 写入发布配置
        # 这些值都会随客户端一起发出去（publishable key 本来就印在每个包里），不是机密；
        # 真正的密钥（OSS AccessKey、DeepSeek key）只在网页端服务端，客户端从不内嵌。
        # APP_VERSION 取 tag 名（如 v1.0.1）——客户端内的"检查更新"就是拿它和本仓库
        # Release 的 tag 比，两边同源才不会误报。
        run: |
          $config = [ordered]@{
            SUPABASE_URL      = "https://jwbczaoevrcrdqqvkfaz.supabase.co"
            SUPABASE_ANON_KEY = "sb_publishable_sKDyEQXOuKnG0pcNcJBTNg_OFB1PAM7"
            OSS_PUBLIC_HOST   = "mianyang-question-bank.oss-cn-chengdu.aliyuncs.com"
            API_BASE_URL      = "https://myquiz.cn"
            SHARE_BASE_URL    = "https://myquiz.cn"
            APP_VERSION       = "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          }
          $config | ConvertTo-Json | Set-Content -Encoding utf8 "config/ci.local.json"
        shell: pwsh

      - name: 安装 NuGet CLI
        # **flutter_inappwebview 的 Windows 端在构建期强制要求它**：
        # 插件的 CMakeLists 走 `find_program(NUGET nuget)`，再用 nuget 从 nuget.org
        # 拉 WIL / WebView2 SDK / nlohmann.json 三个包。找不到 nuget.exe 就是
        # NUGET-NOTFOUND，整个 Windows 构建失败。
        # runner 镜像里虽然有 NuGet，但不保证在 PATH 上（find_program 只认 PATH），
        # 所以显式装一次 —— 已装过就是秒返回的 no-op。
        run: |
          choco install nuget.commandline -y --no-progress
          nuget help | Select-Object -First 1
        shell: pwsh

      - name: 构建（混淆）
        run: |
          # flutter_inappwebview 的 Windows 端拉的是 WIL 1.0.231216.1，它还在 include
          # <experimental/coroutine>；而 VS 2022 17.14（MSVC 14.51）起那个头文件**直接当错误报**
          # （C2338 / STL1011），提示的抑制宏就是下面这个。不加它 Windows 构建必挂。
          # 与语言环境无关，所以 CI 也要加（不像 C4819 只在中文 Windows 上触发）。
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter pub get
          flutter build windows --release `
            --build-name=${{ steps.ver.outputs.name }} `
            --build-number=${{ steps.ver.outputs.code }} `
            --obfuscate `
            --split-debug-info=symbols/windows `
            --extra-gen-snapshot-options=--save-obfuscation-map=symbols/windows/obfuscation-map.json `
            --dart-define-from-file=config/ci.local.json
        shell: pwsh

      - name: 补上 MSVC 运行库（app-local）
        # Flutter **不打包 C 运行时**，它假定目标机器装过 Visual Studio。
        # 没装过的电脑双击 exe 完全没有反应（连错误框都不弹），这是"别的电脑打不开"的头号原因。
        # 微软明确允许把这组 dll 随应用一起分发，随包带上最省事 ——
        # 让用户自己去装一次 VC++ Redistributable，在学校机房里是不现实的。
        #
        # **不要写死 VS 的版本与路径**：runner 镜像升级时 VS 的大版本会变
        # （2022 → 后续版本），路径也跟着变，曾因此让整个发布挂在"找不到目录"上。
        # 用微软官方的 vswhere 定位，再兜一层通配。
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = $null
          if (Test-Path $vswhere) { $vsPath = & $vswhere -latest -products * -property installationPath }
          # 打进日志：出问题时一眼能看出这一跑用的是什么 VS
          Write-Host "VS: $vsPath"

          $crt = $null
          if ($vsPath) {
            $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $crt) {
            $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $crt) { throw "找不到 VC 运行时目录（vswhere 与通配都没命中）—— 不补这组 dll，包发出去在别人电脑上打不开" }

          # **整个 CRT 目录一起拷**（约 10 个 dll / 2 MB）。
          # 只拷 msvcp140 + vcruntime140 + vcruntime140_1 是不够的：新版 STL 还会用到
          # msvcp140_1 / _2 / _threads / _atomic_wait，缺哪个都是同样的"双击没反应"。
          # 2 MB 换掉这类靠人猜的缺失，划算。
          Copy-Item "$($crt.FullName)\*.dll" "build/windows/x64/runner/Release/" -Force
          Write-Host "已从 $($crt.FullName) 补入 $((Get-ChildItem "$($crt.FullName)\*.dll").Count) 个 dll"
        shell: pwsh

      - name: 打包（整个 Release 目录一起，exe 只是入口）
        run: |
          # 资产名固定不带版本号：这样 /releases/latest/download/<名字> 永远指向最新版，
          # 产品页与客户端内"去下载"都能写死链接（版本号在 Release 标题与正文里）。
          $name = "mianyang_quiz-windows-x64"
          New-Item -ItemType Directory -Force -Path "build/dist/$name" | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" "build/dist/$name"
          Compress-Archive -Path "build/dist/$name" -DestinationPath "build/dist/$name.zip" -Force
        shell: pwsh

      - name: 编译安装器（Inno Setup）
        # Inno Setup 不在 runner 的预装列表里，用 Chocolatey 装（runner 自带 choco）。
        # 中文语言文件**不在 Inno 官方发行版里**（官方翻译只到土耳其语），从 issrc 仓库取；
        # 取不到就退回英文界面 —— 安装器照常能装，不该为一个翻译文件卡死整条发布链。
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 安装后找不到 ISCC.exe" }
          # 把版本打出来：脚本用的是 6.3+ 通用指令（x64compatible / WizardStyle / {autopf}），
          # 6 和 7 都能编；万一将来 choco 换了版本导致编译失败，日志里能直接看出是哪一版。
          Write-Host "ISCC 版本：$((Get-Item $iscc.FullName).VersionInfo.FileVersion)"

          $msg = "compiler:Default.isl"
          $cached = Join-Path $PWD "windows\ChineseSimplified.isl"
          try {
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" `
              -OutFile $cached
            $msg = $cached
            Write-Host "已取到中文语言文件"
          } catch {
            Write-Host "::warning::中文语言文件下载失败，安装器将使用英文界面"
          }

          # exe 的版本属性必须是纯数字：Inno 不接受 "1.0.1-dev" 这类后缀，格式不对会**编译失败**，
          # 而这一步失败等于整个发布挂掉（连 zip 都发不出去）。所以这里把非数字后缀砍掉，
          # 砍完仍不成形就用 0.0.0 兜底 —— 宁可版本号朴素，也不能让发布链断在一个显示字段上。
          $numeric = "${{ steps.ver.outputs.name }}" -replace '[^0-9.].*$', ''
          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') { $numeric = "0.0.0" }
          Write-Host "文件版本号：$numeric"

          & $iscc.FullName `
            "/DAppVersion=${{ steps.ver.outputs.name }}" `
            "/DNumericVersion=$numeric" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DMessagesFile=$msg" `
            "windows\installer.iss"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          # 两种形态都给：安装器给普通用户（双击就装完），zip 留给需要免安装/绿色版的人
          path: |
            build/dist/*.zip
            build/dist/*-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-symbols
          path: symbols/windows/*
          if-no-files-found: error

  # ---------- Android ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 版本号（tag → 版本名 + 递增版本号）
        # **必须显式传 --build-number**：否则 Android 的 versionCode 永远是 pubspec 里的 +1，
        # 而系统只允许 versionCode 更大的包覆盖安装 —— 用户会看到装到一半「应用未安装」。
        # 用 run_number 保证单调递增；版本名取 tag（去掉 v 前缀，versionName 不接受它）。
        id: ver
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 写入发布配置
        run: |
          cat > config/ci.local.json <<JSON
          {
            "SUPABASE_URL": "https://jwbczaoevrcrdqqvkfaz.supabase.co",
            "SUPABASE_ANON_KEY": "sb_publishable_sKDyEQXOuKnG0pcNcJBTNg_OFB1PAM7",
            "OSS_PUBLIC_HOST": "mianyang-question-bank.oss-cn-chengdu.aliyuncs.com",
            "API_BASE_URL": "https://myquiz.cn",
            "SHARE_BASE_URL": "https://myquiz.cn",
            "APP_VERSION": "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          }
          JSON

      - name: 配置签名
        # **打 tag 发布时缺密钥直接失败**，不再像以前那样"警告一下、悄悄用 debug 签名发出去"。
        # 那个默认值很坑：debug 签名的包能装、能跑，看起来一切正常，但下一次换台机器
        #（或 GitHub 换了 runner）重新发布的包**签名不同，老用户覆盖安装会失败**，
        # 只能卸载重装——而那时用户已经装了。宁可发布链断在这里。
        #
        # 手动跑（workflow_dispatch）只为验证流水线，允许缺密钥，给警告即可。
        #
        # 生成密钥与填 secret 的步骤见 AGENTS.md 第七节。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done

          if [ -n "$missing" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::发布 ${{ github.ref_name }} 缺少签名密钥:$missing"
              echo "打 tag 发布必须用正式签名——debug 签名的包签名会变，老用户无法覆盖安装。"
              echo "生成与配置步骤见 AGENTS.md 第七节。"
              exit 1
            fi
            echo "::warning::缺少$missing，本次用 debug 签名（仅限非 tag 的流水线验证）"
            exit 0
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # 解出来不是密钥库就早点停：等到 apk 签名那一步才报错，日志里只剩一句
          # "Keystore was tampered with" —— 那通常是 base64 传坏了，不是口令错。
          if ! keytool -list -keystore android/app/release.keystore \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 解出来的不是可用密钥库（多半是 base64 传坏了，注意别带换行/引号）"
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.keystore \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::密钥库里没有别名为 $ANDROID_KEY_ALIAS 的条目，检查 ANDROID_KEY_ALIAS"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "签名配置就绪，别名 $ANDROID_KEY_ALIAS"

      - name: 构建（混淆）
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }} \
            --obfuscate \
            --split-debug-info=symbols/android \
            --dart-define-from-file=config/ci.local.json

      - name: 校验 APK 签名
        # **这是"悄悄发出一个 debug 签名包"的最后一道闸**。
        # 上面那步只管把 key.properties 摆好，真正签成什么由 Gradle 决定 ——
        # 而 android/app/build.gradle.kts 在 key.properties 缺失时是**静默回退 debug 签名**的。
        # 所以构建完必须回头看**产物**上盖的是谁的章，而不是相信配置。
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner（$SDK/build-tools）"
            exit 1
          fi
          echo "用 $APKSIGNER 校验 $APK"
          # **不要写成 `apksigner ... | tee file`**：管道的退出码取自 tee，
          # apksigner 真失败了也会一路走到"校验通过"——那这步就白设了。
          if ! "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certs.txt 2>&1; then
            echo "::error::apksigner 校验失败（APK 没签名或签名坏了）"
            cat /tmp/apk-certs.txt
            exit 1
          fi
          cat /tmp/apk-certs.txt

          if grep -qi "Android Debug" /tmp/apk-certs.txt; then
            echo "::error::产物是 debug 签名——这种包换台机器就发不出可覆盖安装的更新，不能发布"
            exit 1
          fi
          echo "签名校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: symbols/android/*
          if-no-files-found: error

  # ---------- 发布 ----------
  release:
    needs: [build-windows, build-android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 规整资产名
        run: |
          mkdir -p assets
          cp dist/windows-bundle/*.zip assets/
          cp dist/windows-bundle/*-setup.exe assets/
          cp dist/android-apk/*.apk "assets/mianyang_quiz-android.apk"
          ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 客户端内的"检查更新"读的就是这个 Release 的 tag_name，正文顺带写清楚装法
          body: |
            绵阳市中职共建题库客户端 ${{ github.ref_name }}

            - **Android**：下载 `mianyang_quiz-android.apk` 直接安装（首次需允许「安装未知来源应用」）
            - **Windows**：下载 `mianyang_quiz-windows-x64-setup.exe`，双击安装即可
              - 默认按当前用户安装，**不需要管理员权限**；会创建桌面与开始菜单快捷方式
              - 免安装版：`mianyang_quiz-windows-x64.zip`，**解压后运行整个目录里的 exe**（不能只拷 exe）
              - 两种形态都已带上 C 运行库，目标电脑无需另装 Visual C++ Redistributable
          files: assets/*
          fail_on_unmatched_files: true
